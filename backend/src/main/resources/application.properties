# =====================================================================
#  Library Management System — configuration
#  Secrets are NOT stored here. They are read from environment variables,
#  or from backend/.env (copy .env.example -> .env), which is git-ignored.
# =====================================================================
spring.application.name=library-management-system
spring.config.import=optional:file:.env[.properties],optional:file:./application-local.properties

# PORT is set automatically by hosting platforms such as Render; SERVER_PORT is for local use.
server.port=${PORT:${SERVER_PORT:8080}}

# ---------- Database ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library_db}
spring.datasource.username=${DB_USERNAME:library_user}
spring.datasource.password=${DB_PASSWORD}

# The schema is created by database/schema.sql, so Hibernate must not change it.
# Set JPA_DDL_AUTO=validate to make Hibernate check entities against the tables at startup.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIMEZONE:Asia/Kolkata}

# ---------- Security ----------
# JWT_SECRET must be at least 32 characters long.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
# http://localhost:5173 = React dev server, https://localhost = the Android app (Capacitor WebView)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# ---------- Logging ----------
logging.level.com.college.library=INFO
logging.level.org.hibernate.SQL=WARN

# Load lazy relations in batches (avoids the N+1 query problem on lists)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
