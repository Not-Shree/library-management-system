# Alternative to .env: copy this file to backend/application-local.properties
# (git-ignored). Values here override the defaults in src/main/resources/application.properties.
DB_URL=jdbc:postgresql://localhost:5432/library_db
DB_USERNAME=library_user
DB_PASSWORD=change_me
JWT_SECRET=replace-with-a-long-random-string-of-at-least-32-chars
JWT_EXPIRATION_MINUTES=480
CORS_ALLOWED_ORIGINS=http://localhost:5173,https://localhost
APP_TIMEZONE=Asia/Kolkata

# Optional: make Hibernate verify every entity against the database at startup
# JPA_DDL_AUTO=validate

# Optional SMTP settings are NOT used by this version (notifications are in-app only).
