# Render Blueprint: creates the backend API and the frontend site in one step.
# Dashboard -> New -> Blueprint -> pick this repository. See docs/Deployment.md.
# The database is NOT created here: use a free Neon database (Render's free Postgres expires after 30 days).
services:
  - type: web
    name: library-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/categories
    envVars:
      - key: DB_URL              # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET          # random value generated by Render
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS  # frontend URL + https://localhost (Android app), e.g. https://library-web.onrender.com,https://localhost
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata

  - type: web
    name: library-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:                      # send every page URL to the React app (so refreshing /dashboard works)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL   # the backend URL + /api, e.g. https://library-api.onrender.com/api
        sync: false
