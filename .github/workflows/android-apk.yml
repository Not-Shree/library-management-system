# Builds the Android app (APK) on GitHub's servers — no Android Studio needed.
#
# Runs on every push to main that changes the frontend, or by hand:
#   GitHub repo -> Actions -> "Build Android APK" -> Run workflow
#
# Download the APK from either:
#   - Releases -> "Android APK (latest)"   (permanent link, easy to open on a phone)
#   - the workflow run's "Artifacts" section (kept for 30 days)
#
# Optional: Settings -> Secrets and variables -> Actions -> Variables -> New variable
#   ANDROID_API_BASE_URL = https://library-api.onrender.com/api
# makes the app connect to your deployed backend by default (otherwise it uses the
# emulator address and you set the server on the phone's login screen).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write   # needed to publish the APK as a release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build the React app
        run: npm run build
        env:
          VITE_ANDROID_API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk college-library.apk

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v7
        with:
          path: frontend/android/college-library.apk
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Publish the APK as the "Android APK (latest)" release
        working-directory: frontend/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest college-library.apk \
            --target "${{ github.sha }}" \
            --title "Android APK (latest)" \
            --latest=false \
            --notes "Built from ${{ github.sha }} (build #${{ github.run_number }}). Open this page on your Android phone, tap college-library.apk, then allow installing from this source."
